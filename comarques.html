<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Missió Comarques - Per Províncies i Mapa</title>
  <style>
    /* ==========================================================================
       VARIABLES DE DISSENY I PALETA CÀLIDA MEDITERRÀNIA
       ========================================================================== */
    :root {
      --bg-app: #FDF8F0;
      --bg-card: #FFFFFF;
      --bg-soft: #F4ECE1;
      --text-main: #1E293B;
      --text-muted: #64748B;

      /* Colors inspirats en Catalunya */
      --gold: #F59E0B;
      --gold-light: #FEF3C7;
      --gold-dark: #B45309;

      --crimson: #E11D48;
      --crimson-light: #FFE4E6;
      --crimson-dark: #9F1239;

      --sea: #0284C7;
      --sea-light: #E0F2FE;
      --sea-dark: #0369A1;

      --emerald: #059669;
      --emerald-light: #D1FAE5;

      --success: #10B981;
      --success-light: #D1FAE5;
      --success-dark: #047857;

      --danger: #EF4444;
      --danger-light: #FEE2E2;

      --border-radius: 20px;
      --shadow-sm: 0 2px 8px rgba(30, 41, 59, 0.06);
      --shadow-md: 0 8px 20px rgba(30, 41, 59, 0.08);
      --shadow-lg: 0 12px 28px rgba(30, 41, 59, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      line-height: 1.45;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ==========================================================================
       CAPÇALERA FIXA
       ========================================================================== */
    header {
      background: var(--bg-card);
      padding: 14px 18px;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-back {
      background: var(--bg-soft);
      border: none;
      border-radius: 14px;
      width: 42px;
      height: 42px;
      font-size: 1.2rem;
      font-weight: bold;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-back:active {
      transform: scale(0.92);
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }

    .app-subtitle {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .stats-pill {
      background: var(--gold-light);
      color: var(--gold-dark);
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 2px solid #FDE68A;
      white-space: nowrap;
    }

    /* ==========================================================================
       CONTENIDOR PRINCIPAL
       ========================================================================== */
    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    /* ==========================================================================
       TARGETA DE PROGRÉS GLOBAL
       ========================================================================== */
    .progress-hero {
      background: linear-gradient(135deg, #FFFBEB 0%, #FEF3C7 100%);
      border: 2px solid #FCD34D;
      border-radius: var(--border-radius);
      padding: 18px;
      margin-bottom: 22px;
      box-shadow: var(--shadow-sm);
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .progress-title {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--gold-dark);
    }

    .progress-count {
      font-weight: 900;
      font-size: 1.25rem;
      color: var(--crimson);
    }

    .progress-bar-bg {
      background: rgba(255, 255, 255, 0.8);
      height: 16px;
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid #FDE68A;
    }

    .progress-bar-fill {
      background: linear-gradient(90deg, var(--gold) 0%, var(--crimson) 100%);
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .medals-row {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      gap: 6px;
    }

    .medal-badge {
      flex: 1;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 12px;
      padding: 6px 4px;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      border: 1px solid transparent;
      transition: all 0.3s ease;
    }

    .medal-badge.earned {
      background: #FFFFFF;
      color: var(--text-main);
      border-color: var(--gold);
      box-shadow: 0 2px 6px rgba(245, 158, 11, 0.2);
      transform: translateY(-2px);
    }

    .medal-icon {
      font-size: 1.3rem;
      display: block;
      margin-bottom: 2px;
      filter: grayscale(100%) opacity(0.4);
    }

    .medal-badge.earned .medal-icon {
      filter: none;
    }

    /* ==========================================================================
       LLISTA DE PROVÍNCIES
       ========================================================================== */
    .section-label {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 800;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 4px;
    }

    .blocs-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .bloc-card {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 16px;
      box-shadow: var(--shadow-sm);
      border: 2px solid transparent;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .bloc-card:active {
      transform: scale(0.98);
    }

    .bloc-card.completed {
      border-color: var(--success);
      background: linear-gradient(to right, #FFFFFF, #F0FDF4);
    }

    .bloc-icon-box {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      flex-shrink: 0;
    }

    .bloc-info {
      flex: 1;
      min-width: 0;
    }

    .bloc-day {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 2px;
    }

    .bloc-name {
      font-size: 1.12rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .bloc-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bloc-status-pill {
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* ==========================================================================
       TARGETES DE REPTES (MAPA + EXAMEN FINAL)
       ========================================================================== */
    .challenges-stack {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 28px;
    }

    .map-challenge-card {
      background: linear-gradient(135deg, #059669 0%, #047857 100%);
      color: white;
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.15s ease;
    }

    .map-challenge-card:active {
      transform: scale(0.98);
    }

    .final-exam-card {
      background: linear-gradient(135deg, var(--sea) 0%, #0369A1 100%);
      color: white;
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.15s ease;
    }

    .final-exam-card:active {
      transform: scale(0.98);
    }

    .final-exam-title {
      font-size: 1.18rem;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .final-exam-desc {
      font-size: 0.88rem;
      opacity: 0.92;
    }

    .final-exam-btn {
      background: var(--gold);
      color: #1E293B;
      font-weight: 900;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 0.95rem;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    /* ==========================================================================
       VISTA DINS D'UNA PROVÍNCIA (3 PESTANYES: ESTUDI / TEST / MAPA)
       ========================================================================== */
    .tabs-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      background: var(--bg-soft);
      padding: 5px;
      border-radius: 16px;
      margin-bottom: 18px;
      gap: 5px;
    }

    .tab-btn {
      border: none;
      background: transparent;
      padding: 11px 6px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .tab-btn.active {
      background: var(--bg-card);
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    /* ==========================================================================
       TARGETES D'ESTUDI (FLASHCARDS / DESPLEGABLES)
       ========================================================================== */
    .study-tip-banner {
      background: var(--sea-light);
      color: var(--sea-dark);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cards-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .comarca-card {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      border: 2px solid #E2E8F0;
      transition: all 0.25s ease;
    }

    .comarca-card.mastered {
      border-color: var(--success);
      background: #F8FAFC;
    }

    .comarca-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }

    .comarca-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .comarca-title {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--text-main);
    }

    .capital-box {
      background: var(--gold-light);
      border: 2px solid #FDE68A;
      border-radius: 14px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
    }

    .capital-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold-dark);
    }

    .capital-value {
      font-size: 1.15rem;
      font-weight: 900;
      color: var(--crimson-dark);
    }

    .capital-hidden-mask {
      background: var(--gold);
      color: white;
      padding: 4px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
    }

    .trick-box {
      background: var(--bg-soft);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 0.94rem;
      color: var(--text-main);
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .trick-icon {
      font-size: 1.25rem;
      line-height: 1.2;
    }

    .btn-master {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 2px solid #CBD5E1;
      background: white;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-master.active {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .btn-master:active {
      transform: scale(0.97);
    }

    .study-footer-cta {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ==========================================================================
       INTERFÍCIE DE MAPA INTERACTIU
       ========================================================================== */
    .map-wrapper-card {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 16px;
      box-shadow: var(--shadow-md);
    }

    .map-filter-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 14px;
    }

    .filter-chip {
      border: 2px solid #E2E8F0;
      background: var(--bg-app);
      color: var(--text-main);
      padding: 7px 11px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .filter-chip.active {
      background: var(--text-main);
      color: white;
      border-color: var(--text-main);
    }

    .map-mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg-soft);
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 14px;
      gap: 4px;
    }

    .mode-switch-btn {
      border: none;
      background: transparent;
      padding: 8px;
      border-radius: 9px;
      font-size: 0.84rem;
      font-weight: 800;
      color: var(--text-muted);
      cursor: pointer;
    }

    .mode-switch-btn.active {
      background: white;
      color: var(--text-main);
      box-shadow: var(--shadow-sm);
    }

    .map-prompt-box {
      background: var(--sea-light);
      border: 2px solid #BAE6FD;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      text-align: center;
    }

    .map-prompt-sub {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--sea-dark);
      letter-spacing: 0.04em;
    }

    .map-prompt-target {
      font-size: 1.45rem;
      font-weight: 900;
      color: var(--crimson);
      margin-top: 2px;
    }

    .svg-stage {
      width: 100%;
      background: linear-gradient(180deg, #F0F9FF 0%, #E0F2FE 100%);
      border-radius: 16px;
      border: 2px solid #CBD5E1;
      overflow: hidden;
      position: relative;
      touch-action: manipulation;
    }

    .svg-stage svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .comarca-poly {
      stroke: #FFFFFF;
      stroke-width: 1.5;
      stroke-linejoin: round;
      cursor: pointer;
      transition: fill 0.2s ease, opacity 0.2s ease, transform 0.15s ease;
    }

    .comarca-poly:hover {
      filter: brightness(0.93);
    }

    .comarca-poly.inactive-bloc {
      fill: #E2E8F0 !important;
      stroke: #CBD5E1;
      cursor: default;
      opacity: 0.55;
    }

    .comarca-poly.solved {
      fill: #10B981 !important;
      stroke: #065F46;
      stroke-width: 1.8;
    }

    .comarca-poly.wrong-flash {
      fill: #EF4444 !important;
    }

    .comarca-poly.reveal-correct {
      fill: #F59E0B !important;
      stroke: #B45309;
      stroke-width: 2.2;
    }

    .comarca-poly.explored-active {
      fill: #E11D48 !important;
      stroke: #881337;
      stroke-width: 2.2;
    }

    .map-code-label {
      font-size: 8.5px;
      font-weight: 900;
      fill: #1E293B;
      pointer-events: none;
      text-anchor: middle;
      dominant-baseline: central;
      user-select: none;
    }

    .map-code-label.light-text {
      fill: #FFFFFF;
    }

    .map-code-label.muted-text {
      fill: #94A3B8;
    }

    .map-legend-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 10px;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 4px;
      vertical-align: middle;
    }

    .explore-info-card {
      background: var(--gold-light);
      border: 2px solid #FCD34D;
      border-radius: 16px;
      padding: 14px;
      margin-top: 12px;
    }

    /* ==========================================================================
       INTERFÍCIE DE TEST / QUIZ
       ========================================================================== */
    .quiz-container {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 20px;
      box-shadow: var(--shadow-md);
    }

    .quiz-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .streak-badge {
      background: var(--crimson-light);
      color: var(--crimson);
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 800;
    }

    .quiz-progress-track {
      height: 8px;
      background: var(--bg-soft);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .quiz-progress-fill {
      height: 100%;
      background: var(--sea);
      transition: width 0.3s ease;
    }

    .question-type-tag {
      display: inline-block;
      background: var(--sea-light);
      color: var(--sea-dark);
      font-size: 0.78rem;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .question-text {
      font-size: 1.28rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 20px;
      line-height: 1.35;
    }

    .question-highlight {
      color: var(--crimson);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 18px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-app);
      border: 2px solid #E2E8F0;
      border-radius: 16px;
      padding: 16px 18px;
      font-size: 1.06rem;
      font-weight: 800;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .option-btn:hover:not(:disabled) {
      border-color: var(--sea);
      background: var(--sea-light);
    }

    .option-btn:active:not(:disabled) {
      transform: scale(0.98);
    }

    .option-btn.correct {
      background: var(--success-light);
      border-color: var(--success);
      color: var(--success-dark);
    }

    .option-btn.wrong {
      background: var(--danger-light);
      border-color: var(--danger);
      color: #991B1B;
    }

    .option-btn:disabled {
      cursor: default;
    }

    .feedback-panel {
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
      margin-bottom: 14px;
      animation: popIn 0.25s ease;
    }

    .feedback-panel.is-correct {
      background: var(--success-light);
      border: 2px solid var(--success);
      color: var(--success-dark);
    }

    .feedback-panel.is-wrong {
      background: var(--danger-light);
      border: 2px solid var(--danger);
      color: #991B1B;
    }

    .feedback-title {
      font-weight: 900;
      font-size: 1.05rem;
      margin-bottom: 4px;
    }

    .feedback-trick {
      font-size: 0.92rem;
      font-weight: 600;
    }

    /* ==========================================================================
       BOTONS PRIMARIS D'ACCIÓ
       ========================================================================== */
    .btn-primary {
      width: 100%;
      background: var(--crimson);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-size: 1.06rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(225, 29, 72, 0.28);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .btn-primary:active {
      transform: scale(0.97);
    }

    .btn-emerald {
      width: 100%;
      background: var(--emerald);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 15px;
      font-size: 1.02rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(5, 150, 105, 0.25);
    }

    .btn-secondary {
      width: 100%;
      background: var(--bg-soft);
      color: var(--text-main);
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }

    /* ==========================================================================
       PANTALLA DE RESULTATS / CELEBRACIÓ
       ========================================================================== */
    .result-card {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 28px 20px;
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .result-emoji {
      font-size: 4rem;
      margin-bottom: 10px;
      display: block;
      animation: bounce 1s infinite alternate;
    }

    .result-title {
      font-size: 1.55rem;
      font-weight: 900;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .result-score {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--crimson);
      margin: 12px 0;
    }

    .result-desc {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 22px;
    }

    /* ==========================================================================
       SELECTOR CONFIGURACIÓ EXAMEN FINAL
       ========================================================================== */
    .exam-setup-box {
      background: var(--bg-card);
      border-radius: var(--border-radius);
      padding: 22px;
      box-shadow: var(--shadow-md);
      text-align: center;
    }

    .exam-options-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 18px 0;
    }

    .choice-pill {
      padding: 14px;
      border-radius: 14px;
      border: 2px solid #E2E8F0;
      background: var(--bg-app);
      font-weight: 800;
      cursor: pointer;
    }

    .choice-pill.selected {
      border-color: var(--sea);
      background: var(--sea-light);
      color: var(--sea-dark);
    }

    /* ==========================================================================
       PEU I REINICI
       ========================================================================== */
    .reset-zone {
      text-align: center;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px dashed #CBD5E1;
    }

    .btn-reset {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
      padding: 8px 12px;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-box {
      background: white;
      border-radius: 20px;
      padding: 22px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow-lg);
    }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 18px;
    }

    /* ==========================================================================
       ANIMACIONS I CONFETI
       ========================================================================== */
    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }

    .confetti-piece {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 999;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(105vh) rotate(720deg);
      }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

    /* ==========================================================================
       3. UTILITATS GENERALS I GENERACIÓ ALEATÒRIA DE PREGUNTES
       ========================================================================== */
    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function launchConfetti() {
      const colors = ["#F59E0B", "#E11D48", "#10B981", "#0284C7", "#FBBF24"];
      for (let i = 0; i < 45; i++) {
        const piece = document.createElement("div");
        piece.className = "confetti-piece";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = (Math.random() * 1.5 + 1.5) + "s";
        piece.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 3200);
      }
    }

    function createSingleQuestion(item, type, poolComarques) {
      const allOthers = COMARQUES.filter(c => c.id !== item.id);
      const sameBlocOthers = poolComarques.filter(c => c.id !== item.id && c.bloc === item.bloc);
      const otherBlocs = allOthers.filter(c => c.bloc !== item.bloc);
      const distractorPool = [...shuffleArray(sameBlocOthers), ...shuffleArray(otherBlocs)];

      if (type === "capital") {
        const correctAnswer = item.capital;
        const wrongAnswers = distractorPool.slice(0, 3).map(d => d.capital);
        return {
          comarcaObj: item,
          tag: "Busca la capital",
          promptHtml: `Quina és la capital de <span class="question-highlight">${item.comarca}</span>?`,
          correctAnswer,
          options: shuffleArray([correctAnswer, ...wrongAnswers])
        };
      }

      if (type === "comarca") {
        const correctAnswer = item.comarca;
        const wrongAnswers = distractorPool.slice(0, 3).map(d => d.comarca);
        return {
          comarcaObj: item,
          tag: "Busca la comarca",
          promptHtml: `De quina comarca és capital <span class="question-highlight">${item.capital}</span>?`,
          correctAnswer,
          options: shuffleArray([correctAnswer, ...wrongAnswers])
        };
      }

      if (type === "provincia") {
        const blocObj = BLOCS_INFO.find(b => b.id === item.bloc);
        const correctAnswer = blocObj.nom;
        const wrongAnswers = shuffleArray(
          BLOCS_INFO.filter(b => b.id !== item.bloc).map(b => b.nom)
        ).slice(0, 3);
        return {
          comarcaObj: item,
          tag: "Província",
          promptHtml: `A quina província pertany la comarca de <span class="question-highlight">${item.comarca}</span>?`,
          correctAnswer,
          options: shuffleArray([correctAnswer, ...wrongAnswers])
        };
      }

      const correctAnswer = item.comarca;
      const wrongAnswers = distractorPool.slice(0, 3).map(d => d.comarca);
      return {
        comarcaObj: item,
        tag: "Repte amb pista",
        promptHtml: `Quina comarca encaixa amb aquesta pista: <span class="question-highlight">«${item.truc}»</span>?`,
        correctAnswer,
        options: shuffleArray([correctAnswer, ...wrongAnswers])
      };
    }

    function buildQuizQuestions(poolComarques, totalQuestions, isFinalExam) {
      const typesForBloc = ["capital", "comarca", "pista"];
      const typesForExam = ["capital", "comarca", "provincia", "pista"];
      const availableTypes = isFinalExam ? typesForExam : typesForBloc;

      const candidateQuestions = [];

      poolComarques.forEach(item => {
        const shuffledTypes = shuffleArray(availableTypes);
        const countForItem = isFinalExam ? 3 : 2;
        for (let k = 0; k < countForItem; k++) {
          const chosenType = shuffledTypes[k % shuffledTypes.length];
          candidateQuestions.push(createSingleQuestion(item, chosenType, poolComarques));
        }
      });

      const randomized = shuffleArray(candidateQuestions);
      return randomized.slice(0, Math.min(totalQuestions, randomized.length));
    }

    /* ==========================================================================
       4. MOTOR DEL MAPA INTERACTIU (PER PROVÍNCIA O TOTA CATALUNYA)
       ========================================================================== */
    function initMapSession(scopeBlocId, mode = "locate") {
      const pool = scopeBlocId === "all"
        ? COMARQUES
        : COMARQUES.filter(c => c.bloc === scopeBlocId);

      const queue = shuffleArray(pool);
      nav.map = {
        scopeBlocId, // "all" | 1 | 2 | 3 | 4
        mode,        // "locate" | "explore"
        queue,
        currentIndex: 0,
        solvedIds: [],
        score: 0,
        streak: 0,
        answered: false,
        lastClickedId: null,
        isCorrect: false,
        finished: false,
        exploredId: pool[0].id
      };
    }

    function getMapViewBox(scopeBlocId) {
      if (scopeBlocId === 1) return "215 105 265 270"; // Barcelona
      if (scopeBlocId === 2) return "255 65 295 215";  // Girona
      if (scopeBlocId === 3) return "40 10 245 320";   // Lleida
      if (scopeBlocId === 4) return "25 260 265 250";  // Tarragona
      return "25 10 520 500";                          // Tota Catalunya
    }

    function renderMapComponent(allowScopeSelector) {
      if (!nav.map) {
        initMapSession("all", "locate");
      }

      const m = nav.map;
      const pool = m.scopeBlocId === "all"
        ? COMARQUES
        : COMARQUES.filter(c => c.bloc === m.scopeBlocId);

      const scopeFilterHtml = allowScopeSelector ? `
        <div class="map-filter-pills">
          <button class="filter-chip ${m.scopeBlocId === "all" ? "active" : ""}" onclick="changeMapScope('all')">
            🗺️ Totes (42)
          </button>
          ${BLOCS_INFO.map(b => `
            <button class="filter-chip ${m.scopeBlocId === b.id ? "active" : ""}" onclick="changeMapScope(${b.id})">
              ${b.icona} ${b.nom}
            </button>
          `).join("")}
        </div>
      ` : "";

      const modeSwitchHtml = `
        <div class="map-mode-switch">
          <button class="mode-switch-btn ${m.mode === "locate" ? "active" : ""}" onclick="changeMapMode('locate')">
            🎯 Situar al mapa
          </button>
          <button class="mode-switch-btn ${m.mode === "explore" ? "active" : ""}" onclick="changeMapMode('explore')">
            🧭 Explorar lliurement
          </button>
        </div>
      `;

      if (m.mode === "locate" && m.finished) {
        const total = m.queue.length;
        const passed = m.score >= Math.ceil(total * 0.75);
        return `
          <div class="result-card">
            <span class="result-emoji">${passed ? "🗺️🎉" : "🧭💪"}</span>
            <h2 class="result-title">${passed ? "Domines el mapa!" : "Bon entrenament de mapa!"}</h2>
            <div class="result-score">${m.score} / ${total}</div>
            <p class="result-desc">
              Has situat correctament ${m.score} de ${total} comarques al mapa.
            </p>
            <button class="btn-emerald" onclick="restartMapQuiz()">🔄 Tornar a jugar aquest mapa</button>
            <button class="btn-secondary" onclick="goHome()">🏠 Tornar a l'inici</button>
          </div>
        `;
      }

      const targetComarca = m.mode === "locate" ? m.queue[m.currentIndex] : null;
      const exploredComarca = m.mode === "explore"
        ? COMARQUES.find(c => c.id === m.exploredId) || pool[0]
        : null;

      const topPromptHtml = m.mode === "locate" ? `
        <div class="quiz-top-bar" style="margin-bottom:8px;">
          <span>Comarca ${m.currentIndex + 1} de ${m.queue.length}</span>
          ${m.streak >= 2 ? `<span class="streak-badge">🔥 Ratxa: ${m.streak}</span>` : `<span>Encerts: ${m.score}</span>`}
        </div>
        <div class="map-prompt-box">
          <div class="map-prompt-sub">Toca al mapa on es troba:</div>
          <div class="map-prompt-target">📍 ${targetComarca.comarca}</div>
        </div>
      ` : `
        <div class="study-tip-banner" style="margin-bottom:12px;">
          <span>👆</span>
          <span>Toca qualsevol comarca del mapa per veure el seu nom, capital i truc.</span>
        </div>
      `;

      const viewBox = getMapViewBox(m.scopeBlocId);

      const polygonsHtml = COMARQUES.map(c => {
        const inScope = m.scopeBlocId === "all" || c.bloc === m.scopeBlocId;
        const blocObj = BLOCS_INFO.find(b => b.id === c.bloc);
        let classes = ["comarca-poly"];
        let showLabel = false;
        let labelLight = false;

        if (!inScope) {
          classes.push("inactive-bloc");
        } else if (m.mode === "explore") {
          showLabel = true;
          if (c.id === exploredComarca.id) {
            classes.push("explored-active");
            labelLight = true;
          }
        } else {
          // Mode locate
          if (m.solvedIds.includes(c.id)) {
            classes.push("solved");
            showLabel = true;
            labelLight = true;
          }
          if (m.answered) {
            if (c.id === targetComarca.id && !m.isCorrect) {
              classes.push("reveal-correct");
              showLabel = true;
              labelLight = true;
            }
            if (c.id === m.lastClickedId && !m.isCorrect) {
              classes.push("wrong-flash");
              showLabel = true;
              labelLight = true;
            }
          }
        }

        const shortCode = c.comarca
          .replace(/^Alt\s+/i, "A.")
          .replace(/^Alta\s+/i, "A.")
          .replace(/^Baix\s+/i, "B.")
          .replace(/^Pla de l'/i, "P.")
          .replace(/^Pla d'/i, "P.")
          .replace(/^Vallès\s+/i, "V.")
          .replace(/^Pallars\s+/i, "P.")
          .replace(/^Ribera d'/i, "R.")
          .replace(/^Conca de\s+/i, "C.")
          .replace(/^Val d'/i, "V.")
          .slice(0, 7);

        return `
          <g>
            <polygon
              points="${c.poly}"
              fill="${blocObj.mapFill}"
              class="${classes.join(" ")}"
              ${inScope ? `onclick="handleMapClick('${c.id}')"` : ""}
            ></polygon>
            ${showLabel ? `
              <text x="${c.cx}" y="${c.cy}" class="map-code-label ${labelLight ? "light-text" : ""}">
                ${shortCode}
              </text>
            ` : ""}
          </g>
        `;
      }).join("");

      const feedbackOrExploreHtml = m.mode === "locate"
        ? (m.answered ? `
            <div class="feedback-panel ${m.isCorrect ? "is-correct" : "is-wrong"}">
              <div class="feedback-title">
                ${m.isCorrect
                  ? `🌟 Exacte! Has trobat ${targetComarca.comarca} (+10 punts)`
                  : `😅 Has tocat ${COMARQUES.find(c => c.id === m.lastClickedId)?.comarca || "una altra zona"}. ${targetComarca.comarca} està marcada en taronja!`}
              </div>
              <div class="feedback-trick">
                🏛️ <strong>Capital:</strong> ${targetComarca.capital} · 💡 ${targetComarca.truc}
              </div>
            </div>
            <button class="btn-primary" onclick="nextMapQuestion()">
              ${m.currentIndex + 1 < m.queue.length ? "Següent comarca →" : "Veure resultats del mapa 🏆"}
            </button>
          ` : "")
        : `
          <div class="explore-info-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <span style="font-size:0.76rem; font-weight:800; text-transform:uppercase; color:var(--gold-dark);">
                Província de ${BLOCS_INFO.find(b => b.id === exploredComarca.bloc).nom}
              </span>
              <span style="font-size:0.85rem; font-weight:800; color:var(--crimson);">
                🏛️ ${exploredComarca.capital}
              </span>
            </div>
            <div style="font-size:1.3rem; font-weight:900; color:var(--text-main); margin-bottom:6px;">
              ${exploredComarca.comarca}
            </div>
            <div style="font-size:0.9rem; color:var(--text-main);">
              💡 ${exploredComarca.truc}
            </div>
          </div>
        `;

      return `
        <div class="map-wrapper-card">
          ${scopeFilterHtml}
          ${modeSwitchHtml}
          ${topPromptHtml}

          <div class="svg-stage">
            <svg viewBox="${viewBox}" role="img" aria-label="Mapa interactiu de les comarques de Catalunya">
              ${polygonsHtml}
            </svg>
          </div>

          <div class="map-legend-row">
            <span><span class="legend-dot" style="background:#FDA4AF;"></span>Barcelona</span>
            <span><span class="legend-dot" style="background:#5EEAD4;"></span>Girona</span>
            <span><span class="legend-dot" style="background:#7DD3FC;"></span>Lleida</span>
            <span><span class="legend-dot" style="background:#FDBA74;"></span>Tarragona</span>
          </div>

          ${feedbackOrExploreHtml}
        </div>
      `;
    }

    /* ==========================================================================
       5. RENDERITZAT DE CAPÇALERA I VISTES
       ========================================================================== */
    function updateHeaderStats() {
      document.getElementById("points-display").textContent = state.points;
      const btnIndex = document.getElementById("btn-index");
      const btnBack = document.getElementById("btn-back");
      const titleEl = document.getElementById("header-title");
      const subEl = document.getElementById("header-subtitle");

      if (nav.view === "home") {
        btnIndex.classList.remove("hidden");
        btnBack.classList.add("hidden");
        titleEl.textContent = "Missió Comarques";
        subEl.textContent = `4 províncies · ${COMARQUES.length} comarques`;
      } else if (nav.view === "bloc") {
        btnIndex.classList.add("hidden");
        btnBack.classList.remove("hidden");
        const bloc = BLOCS_INFO.find(b => b.id === nav.activeBlocId);
        titleEl.textContent = `Província de ${bloc.nom}`;
        subEl.textContent = bloc.descripcio;
      } else if (nav.view === "exam") {
        btnIndex.classList.add("hidden");
        btnBack.classList.remove("hidden");
        titleEl.textContent = "Examen Final";
        subEl.textContent = "Repte aleatori de les 4 províncies";
      } else if (nav.view === "map") {
        btnIndex.classList.add("hidden");
        btnBack.classList.remove("hidden");
        titleEl.textContent = "Mapa de Comarques";
        subEl.textContent = "Situa cada comarca al mapa de Catalunya";
      }
    }

    function render() {
      updateHeaderStats();
      const root = document.getElementById("app-root");

      if (nav.view === "home") {
        renderHome(root);
      } else if (nav.view === "bloc") {
        renderBloc(root);
      } else if (nav.view === "exam") {
        renderExam(root);
      } else if (nav.view === "map") {
        root.innerHTML = renderMapComponent(true);
      }
    }

    /* --------------------------------------------------------------------------
       VISTA 1: PANTALLA D'INICI (PER PROVÍNCIES)
       -------------------------------------------------------------------------- */
    function renderHome(root) {
      const masteredCount = state.masteredIds.length;
      const totalCount = COMARQUES.length;
      const pct = Math.round((masteredCount / totalCount) * 100);

      const medalsHtml = BLOCS_INFO.map(b => {
        const earned = state.completedBlocs.includes(b.id);
        return `
          <div class="medal-badge ${earned ? "earned" : ""}">
            <span class="medal-icon">${b.icona}</span>
            <div>${b.nom}</div>
          </div>
        `;
      }).join("");

      const blocsHtml = BLOCS_INFO.map(b => {
        const blocComarques = COMARQUES.filter(c => c.bloc === b.id);
        const blocMastered = blocComarques.filter(c => state.masteredIds.includes(c.id)).length;
        const isCompleted = state.completedBlocs.includes(b.id);

        let statusText = `${blocMastered}/${blocComarques.length} apreses`;
        let pillStyle = `background: ${b.colorBg}; color: ${b.colorText};`;
        let pillLabel = "Entrar →";

        if (isCompleted) {
          pillStyle = `background: var(--success-light); color: var(--success-dark);`;
          pillLabel = "Superat ✓";
        }

        return `
          <div class="bloc-card ${isCompleted ? "completed" : ""}" onclick="openBloc(${b.id})">
            <div class="bloc-icon-box" style="background: ${b.colorBg};">
              ${b.icona}
            </div>
            <div class="bloc-info">
              <div class="bloc-day" style="color: ${b.colorText};">${b.dia} · ${blocComarques.length} comarques</div>
              <div class="bloc-name">${b.nom}</div>
              <div class="bloc-meta">
                <span>🎯 ${statusText}</span>
              </div>
            </div>
            <div class="bloc-status-pill" style="${pillStyle}">
              ${pillLabel}
            </div>
          </div>
        `;
      }).join("");

      root.innerHTML = `
        <div class="progress-hero">
          <div class="progress-header">
            <span class="progress-title">El teu progrés global</span>
            <span class="progress-count">${masteredCount} / ${totalCount}</span>
          </div>
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" style="width: ${pct}%;"></div>
          </div>
          <div class="medals-row">
            ${medalsHtml}
          </div>
        </div>

        <div class="section-label">Comarques per províncies</div>
        <div class="blocs-grid">
          ${blocsHtml}
        </div>

        <div class="section-label">Posa't a prova</div>
        <div class="challenges-stack">
          <div class="map-challenge-card" onclick="openGlobalMap()">
            <div>
              <div class="final-exam-title">🗺️ Situar Comarques al Mapa</div>
              <div class="final-exam-desc">
                Troba on està cada comarca al mapa de Catalunya o filtra per província!
              </div>
            </div>
            <div class="final-exam-btn">Mapa</div>
          </div>

          <div class="final-exam-card" onclick="openExam()">
            <div>
              <div class="final-exam-title">🏆 Gran Examen Final</div>
              <div class="final-exam-desc">
                Preguntes aleatòries de comarques, capitals, províncies i pistes de tot Catalunya!
                ${state.bestExamStreak > 0 ? `<br><strong>Millor ratxa: ${state.bestExamStreak} encerts seguits 🔥</strong>` : ""}
              </div>
            </div>
            <div class="final-exam-btn">Jugar</div>
          </div>
        </div>

        <div class="reset-zone">
          <button class="btn-reset" onclick="openResetModal()">Reiniciar tot el progrés del curs</button>
        </div>
      `;
    }

    /* --------------------------------------------------------------------------
       VISTA 2: DINS D'UNA PROVÍNCIA (ESTUDI / TEST / MAPA)
       -------------------------------------------------------------------------- */
    function renderBloc(root) {
      const bloc = BLOCS_INFO.find(b => b.id === nav.activeBlocId);
      const blocComarques = COMARQUES.filter(c => c.bloc === bloc.id);
      const blocQuizLength = blocComarques.length * 2;

      let contentHtml = "";

      if (nav.activeTab === "study") {
        const cardsHtml = blocComarques.map(c => {
          const isMastered = state.masteredIds.includes(c.id);
          const isHidden = !!nav.revealedCapitals[c.id];

          return `
            <div class="comarca-card ${isMastered ? "mastered" : ""}">
              <div class="comarca-top">
                <div>
                  <div class="comarca-label">Comarca · ${bloc.nom}</div>
                  <div class="comarca-title">${c.comarca}</div>
                </div>
                <span style="font-size: 1.3rem;">${isMastered ? "✅" : "📍"}</span>
              </div>

              <div class="capital-box" onclick="toggleCapitalVisibility('${c.id}')" title="Toca per amagar o mostrar la capital">
                <span class="capital-label">Capital:</span>
                ${isHidden
                  ? `<span class="capital-hidden-mask">👁️ Toca per veure</span>`
                  : `<span class="capital-value">${c.capital}</span>`
                }
              </div>

              <div class="trick-box">
                <span class="trick-icon">💡</span>
                <div><strong>Truc:</strong> ${c.truc}</div>
              </div>

              <button class="btn-master ${isMastered ? "active" : ""}" onclick="toggleMastered('${c.id}')">
                ${isMastered ? "✓ Ja me la sé!" : "Marcar com a apresa"}
              </button>
            </div>
          `;
        }).join("");

        contentHtml = `
          <div class="study-tip-banner">
            <span>👆</span>
            <span>Llegeix el truc de cada comarca de <strong>${bloc.nom}</strong>. Toca la caixa groga per amagar o mostrar la capital.</span>
          </div>
          <div class="cards-list">
            ${cardsHtml}
          </div>
          <div class="study-footer-cta">
            <button class="btn-emerald" onclick="switchBlocTab('map')">
              🗺️ Situar les comarques de ${bloc.nom} al mapa
            </button>
            <button class="btn-primary" onclick="switchBlocTab('quiz')">
              🎯 Fer el Test de ${bloc.nom} (${blocQuizLength} preguntes aleatòries)
            </button>
          </div>
        `;
      } else if (nav.activeTab === "quiz") {
        contentHtml = renderQuizEngine(blocComarques, false);
      } else if (nav.activeTab === "map") {
        contentHtml = renderMapComponent(false);
      }

      root.innerHTML = `
        <div class="tabs-bar">
          <button class="tab-btn ${nav.activeTab === "study" ? "active" : ""}" onclick="switchBlocTab('study')">
            📖 Estudi
          </button>
          <button class="tab-btn ${nav.activeTab === "quiz" ? "active" : ""}" onclick="switchBlocTab('quiz')">
            🎯 Test
          </button>
          <button class="tab-btn ${nav.activeTab === "map" ? "active" : ""}" onclick="switchBlocTab('map')">
            🗺️ Mapa
          </button>
        </div>
        ${contentHtml}
      `;
    }

    /* --------------------------------------------------------------------------
       VISTA 3: EXAMEN FINAL
       -------------------------------------------------------------------------- */
    function renderExam(root) {
      if (!nav.quiz) {
        root.innerHTML = `
          <div class="exam-setup-box">
            <div style="font-size: 3.5rem; margin-bottom: 10px;">🏆</div>
            <h2 style="font-size: 1.45rem; font-weight: 900; margin-bottom: 8px;">Gran Repte Aleatori</h2>
            <p style="color: var(--text-muted); font-size: 0.95rem;">
              Preguntes aleatòries de comarques, capitals, províncies i pistes de <strong>Barcelona, Girona, Lleida i Tarragona</strong>.
            </p>

            <div class="exam-options-row">
              <div class="choice-pill ${nav.examConfigCount === 30 ? "selected" : ""}" onclick="setExamCount(30)">
                ⚡ 30 Preguntes<br><span style="font-size:0.78rem; font-weight:600;">Complet (5 min)</span>
              </div>
              <div class="choice-pill ${nav.examConfigCount === 45 ? "selected" : ""}" onclick="setExamCount(45)">
                🔥 45 Preguntes<br><span style="font-size:0.78rem; font-weight:600;">Marató Expert</span>
              </div>
            </div>

            <button class="btn-primary" onclick="startFinalExam()">Començar Examen Ara!</button>
          </div>
        `;
        return;
      }

      root.innerHTML = renderQuizEngine(COMARQUES, true);
    }

    /* --------------------------------------------------------------------------
       MOTOR COMÚ DE PREGUNTES I RESULTATS
       -------------------------------------------------------------------------- */
    function renderQuizEngine(poolComarques, isFinalExam) {
      if (!nav.quiz) {
        const count = isFinalExam ? nav.examConfigCount : poolComarques.length * 2;
        nav.quiz = {
          questions: buildQuizQuestions(poolComarques, count, isFinalExam),
          currentIndex: 0,
          score: 0,
          streak: 0,
          answered: false,
          selectedOption: null,
          isCorrect: false,
          finished: false,
          isFinalExam
        };
      }

      const qState = nav.quiz;

      if (qState.finished) {
        const total = qState.questions.length;
        const passed = qState.score >= Math.ceil(total * 0.75);
        const bloc = !isFinalExam ? BLOCS_INFO.find(b => b.id === nav.activeBlocId) : null;

        return `
          <div class="result-card">
            <span class="result-emoji">${passed ? "🎉" : "💪"}</span>
            <h2 class="result-title">
              ${passed
                ? (isFinalExam ? "Examen Superat!" : `Has guanyat la ${bloc.medalla}!`)
                : "Molt bon intent!"}
            </h2>
            <div class="result-score">${qState.score} / ${total}</div>
            <p class="result-desc">
              ${passed
                ? "Has demostrat que domines aquestes comarques, capitals i pistes. Continua així!"
                : "Repassa els trucs de les que has fallat i torna-ho a provar per aconseguir la medalla!"}
            </p>
            <button class="btn-primary" onclick="restartCurrentQuiz()">🔄 Tornar a fer el test (noves preguntes)</button>
            <button class="btn-secondary" onclick="goHome()">🏠 Tornar al menú de províncies</button>
          </div>
        `;
      }

      const currentQ = qState.questions[qState.currentIndex];
      const total = qState.questions.length;
      const progressPct = ((qState.currentIndex) / total) * 100;

      const optionsHtml = currentQ.options.map(opt => {
        let extraClass = "";
        let badgeIcon = "";

        if (qState.answered) {
          if (opt === currentQ.correctAnswer) {
            extraClass = "correct";
            badgeIcon = "✅";
          } else if (opt === qState.selectedOption) {
            extraClass = "wrong";
            badgeIcon = "❌";
          }
        }

        const safeOpt = opt.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
        return `
          <button
            class="option-btn ${extraClass}"
            ${qState.answered ? "disabled" : ""}
            onclick="submitAnswer('${safeOpt}')"
          >
            <span>${opt}</span>
            <span>${badgeIcon}</span>
          </button>
        `;
      }).join("");

      const feedbackHtml = qState.answered ? `
        <div class="feedback-panel ${qState.isCorrect ? "is-correct" : "is-wrong"}">
          <div class="feedback-title">
            ${qState.isCorrect ? "🌟 Molt bé! +10 punts" : `😅 Ups! La resposta era: ${currentQ.correctAnswer}`}
          </div>
          <div class="feedback-trick">
            💡 ${currentQ.comarcaObj.truc}
          </div>
        </div>
        <button class="btn-primary" onclick="nextQuestion()">
          ${qState.currentIndex + 1 < total ? "Següent pregunta →" : "Veure resultats 🏆"}
        </button>
      ` : "";

      return `
        <div class="quiz-container">
          <div class="quiz-top-bar">
            <span>Pregunta ${qState.currentIndex + 1} de ${total}</span>
            ${qState.streak >= 2 ? `<span class="streak-badge">🔥 Ratxa: ${qState.streak}</span>` : `<span>Encerts: ${qState.score}</span>`}
          </div>

          <div class="quiz-progress-track">
            <div class="quiz-progress-fill" style="width: ${progressPct}%;"></div>
          </div>

          <div class="question-type-tag">${currentQ.tag}</div>

          <div class="question-text">${currentQ.promptHtml}</div>

          <div class="options-grid">
            ${optionsHtml}
          </div>

          ${feedbackHtml}
        </div>
      `;
    }

    /* ==========================================================================
       6. ACCIONS DE L'USUARI I HANDLERS
       ========================================================================== */
    function goHome() {
      nav.view = "home";
      nav.quiz = null;
      nav.map = null;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openBloc(blocId) {
      nav.view = "bloc";
      nav.activeBlocId = blocId;
      nav.activeTab = "study";
      nav.quiz = null;
      nav.map = null;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function switchBlocTab(tab) {
      nav.activeTab = tab;
      if (tab === "quiz") {
        const blocComarques = COMARQUES.filter(c => c.bloc === nav.activeBlocId);
        nav.quiz = {
          questions: buildQuizQuestions(blocComarques, blocComarques.length * 2, false),
          currentIndex: 0,
          score: 0,
          streak: 0,
          answered: false,
          selectedOption: null,
          isCorrect: false,
          finished: false,
          isFinalExam: false
        };
      } else if (tab === "map") {
        initMapSession(nav.activeBlocId, "locate");
      } else {
        nav.quiz = null;
      }
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function openGlobalMap() {
      nav.view = "map";
      initMapSession("all", "locate");
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function changeMapScope(scopeBlocId) {
      const currentMode = nav.map ? nav.map.mode : "locate";
      initMapSession(scopeBlocId, currentMode);
      render();
    }

    function changeMapMode(mode) {
      const currentScope = nav.map ? nav.map.scopeBlocId : "all";
      initMapSession(currentScope, mode);
      render();
    }

    function handleMapClick(clickedId) {
      if (!nav.map) return;

      if (nav.map.mode === "explore") {
        nav.map.exploredId = clickedId;
        render();
        return;
      }

      if (nav.map.answered) return;

      const target = nav.map.queue[nav.map.currentIndex];
      const isCorrect = clickedId === target.id;

      nav.map.answered = true;
      nav.map.lastClickedId = clickedId;
      nav.map.isCorrect = isCorrect;

      if (isCorrect) {
        nav.map.score += 1;
        nav.map.streak += 1;
        state.points += 10;
        if (!nav.map.solvedIds.includes(target.id)) {
          nav.map.solvedIds.push(target.id);
        }
        if (!state.masteredIds.includes(target.id)) {
          state.masteredIds.push(target.id);
        }
      } else {
        nav.map.streak = 0;
      }

      saveState();
      render();
    }

    function nextMapQuestion() {
      if (!nav.map) return;

      if (nav.map.currentIndex + 1 < nav.map.queue.length) {
        nav.map.currentIndex += 1;
        nav.map.answered = false;
        nav.map.lastClickedId = null;
        nav.map.isCorrect = false;
      } else {
        nav.map.finished = true;
        const total = nav.map.queue.length;
        if (nav.map.score >= Math.ceil(total * 0.75)) {
          launchConfetti();
        }
      }

      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function restartMapQuiz() {
      if (!nav.map) return;
      initMapSession(nav.map.scopeBlocId, "locate");
      render();
    }

    function toggleCapitalVisibility(comarcaId) {
      nav.revealedCapitals[comarcaId] = !nav.revealedCapitals[comarcaId];
      render();
    }

    function toggleMastered(comarcaId) {
      const idx = state.masteredIds.indexOf(comarcaId);
      if (idx === -1) {
        state.masteredIds.push(comarcaId);
        state.points += 5;
      } else {
        state.masteredIds.splice(idx, 1);
      }
      saveState();
      render();
    }

    function openExam() {
      nav.view = "exam";
      nav.quiz = null;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function setExamCount(count) {
      nav.examConfigCount = count;
      render();
    }

    function startFinalExam() {
      nav.quiz = {
        questions: buildQuizQuestions(COMARQUES, nav.examConfigCount, true),
        currentIndex: 0,
        score: 0,
        streak: 0,
        answered: false,
        selectedOption: null,
        isCorrect: false,
        finished: false,
        isFinalExam: true
      };
      render();
    }

    function submitAnswer(chosenOption) {
      if (!nav.quiz || nav.quiz.answered) return;

      const currentQ = nav.quiz.questions[nav.quiz.currentIndex];
      const isCorrect = chosenOption === currentQ.correctAnswer;

      nav.quiz.answered = true;
      nav.quiz.selectedOption = chosenOption;
      nav.quiz.isCorrect = isCorrect;

      if (isCorrect) {
        nav.quiz.score += 1;
        nav.quiz.streak += 1;
        state.points += 10;

        if (!state.masteredIds.includes(currentQ.comarcaObj.id)) {
          state.masteredIds.push(currentQ.comarcaObj.id);
        }

        if (nav.quiz.isFinalExam && nav.quiz.streak > state.bestExamStreak) {
          state.bestExamStreak = nav.quiz.streak;
        }
      } else {
        nav.quiz.streak = 0;
      }

      saveState();
      render();
    }

    function nextQuestion() {
      if (!nav.quiz) return;

      if (nav.quiz.currentIndex + 1 < nav.quiz.questions.length) {
        nav.quiz.currentIndex += 1;
        nav.quiz.answered = false;
        nav.quiz.selectedOption = null;
        nav.quiz.isCorrect = false;
      } else {
        nav.quiz.finished = true;
        const total = nav.quiz.questions.length;
        const passed = nav.quiz.score >= Math.ceil(total * 0.75);

        if (passed) {
          launchConfetti();
          if (!nav.quiz.isFinalExam && !state.completedBlocs.includes(nav.activeBlocId)) {
            state.completedBlocs.push(nav.activeBlocId);
            state.points += 50;
            saveState();
          }
        }
      }

      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function restartCurrentQuiz() {
      if (!nav.quiz) return;
      if (nav.quiz.isFinalExam) {
        startFinalExam();
      } else {
        switchBlocTab("quiz");
      }
    }

    function openResetModal() {
      document.getElementById("reset-modal").classList.remove("hidden");
    }

    document.getElementById("btn-cancel-reset").addEventListener("click", () => {
      document.getElementById("reset-modal").classList.add("hidden");
    });

    document.getElementById("btn-confirm-reset").addEventListener("click", () => {
      state = {
        masteredIds: [],
        completedBlocs: [],
        points: 0,
        bestExamStreak: 0
      };
      nav.revealedCapitals = {};
      saveState();
      document.getElementById("reset-modal").classList.add("hidden");
      goHome();
    });

    document.getElementById("btn-back").addEventListener("click", goHome);

    window.addEventListener("DOMContentLoaded", () => {
      loadState();
      render();
    });
  </script>
</body>
</html>
